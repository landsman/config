# Which hostname each install gets. Read by ./set.sh, applied by `make hostname`.
#
# Three columns, whitespace separated: device, os, hostname.
#
#   device    what `make stow` detects: the last word of the DMI product_version,
#             lowercased ("ThinkPad T480" -> t480)
#   os        ID from /etc/os-release, as the install reports it — omarchy, not
#             arch; ubuntu, not kubuntu
#   hostname  <Device>-<the install's own name>
#
# A table and not a formula, because the ids are not the names: Kubuntu says
# ID=ubuntu, and T480-ubuntu is not the install anyone boots.
#
# Blank lines and # lines are ignored. Windows is named by hand, see
# ../../devices/t480/docs/hardware.md — nothing in this repo runs there.

t480    ubuntu     T480-kubuntu
t480    omarchy    T480-omarchy
