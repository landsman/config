# Which app opens what. Read by ./file-associations.sh, applied by `make macos`.
#
# Three columns, whitespace separated: kind, what, bundle id. macOS stores an
# association under one of three keys depending on how the thing is named, and
# the kind here is which one — Finder picks for you, so copy what it wrote.
#
#   ext     a filename extension, for a type no app claims a UTI for
#   uti     a content type, which is how most known file types are matched
#   scheme  a URL scheme, i.e. which app opens a link
#
# Blank lines and # lines are ignored. Anything not listed here is left as the
# machine has it — including the URL schemes apps register for themselves at
# install time (slack:, figma:, steam:), which are not choices worth tracking.
#
# Every app named here is in the Brewfile, and on Linux in
# ../../os/ubuntu/install-apps.sh, so a fresh machine has what these point at.

# Editors
ext     sql                                           com.sublimetext.4

# Web. The browser is Chrome, and that is not set here: which app opens a link is
# the one association macOS reserves for the user. `https` is refused with -54,
# `http` is accepted and then ignored, and the "Default web browser" dropdown is
# not a real content type at all (-50). It is System Settings > Desktop & Dock >
# Default web browser, by hand, once per machine. A saved .html file is a normal
# association and does belong here.
uti     public.html                                   com.google.chrome

# Media
uti     public.mpeg-4                                 org.videolan.vlc
uti     com.apple.m4a-audio                           org.videolan.vlc

# Office. One UTI per format, not per extension: .doc and .docx are two
# different types to macOS, and setting one says nothing about the other.
uti     com.microsoft.word.doc                        org.libreoffice.script
uti     org.openxmlformats.wordprocessingml.document  org.libreoffice.script
uti     org.openxmlformats.spreadsheetml.sheet        org.libreoffice.script
