; Audio mode. OBS cannot record without video, so it records a black 640x360
; frame at 10 fps and 50 kbps (recordEncoder.json), which saving drops.
; Tracks: 1 = both mixed, 2 = the call, 3 = me. @RECORDINGS@ is filled in by
; record.sh setup.
[General]
Name=MeetAudio

[Output]
Mode=Advanced

[AdvOut]
RecType=Standard
RecFilePath=@RECORDINGS@/.obs
RecFormat2=mkv
RecEncoder=obs_x264
RecTracks=7
Track1Bitrate=192
Track2Bitrate=192
Track3Bitrate=192
Track1Name=Mix
Track2Name=Call
Track3Name=Me

[Video]
BaseCX=640
BaseCY=360
OutputCX=640
OutputCY=360
FPSType=0
FPSCommon=10

[Audio]
SampleRate=48000
ChannelSetup=Stereo
