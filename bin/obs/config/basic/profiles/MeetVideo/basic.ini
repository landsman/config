; Video mode: the built-in screen (display.js, 3456x2234) scaled to 2560x1654,
; its aspect ratio, so small text stays readable,
; on the hardware encoder.
; Tracks as in the audio profile.
[General]
Name=MeetVideo

[Output]
Mode=Advanced
; No space in the name, so a terminal makes the printed path clickable.
FilenameFormatting=%CCYY-%MM-%DD_%hh-%mm-%ss

[AdvOut]
RecType=Standard
RecFilePath=@RECORDINGS@/.obs
RecFormat2=mkv
RecEncoder=com.apple.videotoolbox.videoencoder.ave.avc
RecTracks=7
Track1Bitrate=192
Track2Bitrate=192
Track3Bitrate=192
Track1Name=Mix
Track2Name=Call
Track3Name=Me

[Video]
BaseCX=2560
BaseCY=1654
OutputCX=2560
OutputCY=1654
FPSType=0
FPSCommon=30

[Audio]
SampleRate=48000
ChannelSetup=Stereo
