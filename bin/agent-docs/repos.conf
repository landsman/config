# The upstream docs the agent rules grep. Read by ./clone.sh, applied by
# `make agent-docs`.
#
# One section per clone. The section name is the directory under ~/projects,
# and the keys are:
#
#   url     where to clone from                     required
#   sparse  paths to check out, space separated     optional
#
# `sparse` makes the clone shallow as well, because only those paths are ever
# read: github/docs is the whole of docs.github.com and 8.5 MB of it is enough,
# with data/ alongside content/ because the pages transclude snippets from
# there.
#
# Leaving `sparse` out clones the repository whole, which forgejo/docs needs: it
# is read per version branch (`v16.0` is what a pinned instance runs, `next` is
# not) and a shallow clone has no branches to switch to.
#
# Blank lines and # lines are ignored. An unknown key, a missing url or a key
# outside a section stops the run and says which line, so a typo cannot quietly
# clone the wrong thing.

[github/github_docs]
url    = https://github.com/github/docs.git
sparse = content/actions data/reusables/actions data/variables

[codeberg/forgejo/docs]
url    = https://codeberg.org/forgejo/docs.git
