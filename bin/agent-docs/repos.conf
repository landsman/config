# The upstream docs the agent rules grep. Read by ./clone.sh, applied by
# `make agent-docs`.
#
# Whitespace separated: a directory under ~/projects, a clone url, and then the
# paths to check out — as many as needed, or none.
#
#   <directory>  <url>  [path...]
#
# Naming paths makes the clone sparse *and* shallow, because only those paths
# are ever read: github/docs is the whole of docs.github.com and 8.5 MB of it is
# enough, with data/ alongside content/ because the pages transclude snippets
# from there.
#
# Naming none clones the repository whole, which forgejo/docs needs: it is read
# per version branch (`v16.0` is what a pinned instance runs, `next` is not) and
# a shallow clone has no branches to switch to.
#
# Blank lines and # lines are ignored. A row added here needs nothing else —
# `make agent-docs` clones what is missing and fast-forwards what is not.

github/github_docs     https://github.com/github/docs.git     content/actions data/reusables/actions data/variables
codeberg/forgejo/docs  https://codeberg.org/forgejo/docs.git
