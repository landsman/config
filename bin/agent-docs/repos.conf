# The upstream docs worth having on disk, so an agent greps them instead of
# recalling an API from training data. Read by ./clone.sh, applied by
# `make agent-docs`.
#
# One section per clone. The section name is the directory under ~/projects, and
# it is `forge/owner/repo` — the same shape the checkouts of other people's code
# already use, so a path is an address: github/spring/spring-boot is
# github.com/spring-projects/spring-boot, checked out to its documentation. The
# keys are:
#
#   url     where to clone from                     required
#   ref     tag or branch to check out              optional, default branch
#   sparse  paths to check out, space separated     optional, whole repo
#
# `sparse` makes the clone shallow as well, because only those paths are ever
# read: vaadin/docs is 640 MB of a documentation *site* and `articles` is the
# part written in prose, spring-boot is a 220 MB monorepo carrying one directory
# anybody here opens.
#
# Leaving `sparse` out clones the repository whole, which forgejo/docs needs: it
# is read per version branch (`v16.0` is what a pinned instance runs, `next` is
# not) and a shallow clone has no branches to switch to.
#
# `ref` names what to check out, for docs that describe a version rather than a
# project — the Spring ones match the releases in use, next.js follows its
# release branch. A clone with a `ref` is never fast-forwarded onto anything
# else: it is re-fetched at exactly the ref it names, so a tag never moves and a
# branch follows that branch. Changing the value here is what repoints a clone.
#
# The sections are grouped by what the reading is for. The groups are comments —
# the directories stay `forge/owner/repo`, because a path that is an address is
# worth more than a path that is a filing decision.
#
# Blank lines and # lines are ignored. An unknown key, a missing url or a key
# outside a section stops the run and says which line, so a typo cannot quietly
# clone the wrong thing.

# ---------------------------------------------------------------- Forges

[github/github/docs]
url    = https://github.com/github/docs.git
sparse = content/actions data/reusables/actions data/variables

[codeberg/forgejo/docs]
url    = https://codeberg.org/forgejo/docs.git

# ---------------------------------------------------------------- Java, Vaadin, testing

[github/vaadin/docs]
url    = https://github.com/vaadin/docs.git
sparse = articles

# The three source repositories, where the reference is the code: JSDoc and
# type definitions in web-components, Java in flow and flow-components. Each
# also carries a `guidelines/` directory of prose about how the components are
# built, which is the part that reads like documentation.
#
# web-components is checked out to two directories because the rest of it is a
# site generator, dev pages and test scaffolding; flow and flow-components are
# whole, because their source is spread across sixty top-level modules and
# listing those here would be a second copy of their build.
[github/vaadin/web-components]
url    = https://github.com/vaadin/web-components.git
sparse = guidelines packages

[github/vaadin/flow]
url    = https://github.com/vaadin/flow.git

[github/vaadin/flow-components]
url    = https://github.com/vaadin/flow-components.git

[github/testcontainers/testcontainers-java]
url    = https://github.com/testcontainers/testcontainers-java.git
sparse = docs

[github/spring/spring-boot]
url    = https://github.com/spring-projects/spring-boot.git
ref    = v4.1.1
sparse = documentation/spring-boot-docs/src/docs

[github/spring/spring-security]
url    = https://github.com/spring-projects/spring-security.git
sparse = docs

[github/spring/spring-session]
url    = https://github.com/spring-projects/spring-session.git
sparse = spring-session-docs

[github/spring/spring-data-jpa]
url    = https://github.com/spring-projects/spring-data-jpa.git
ref    = 4.1.1
sparse = src/main/antora

[github/spring/spring-data-relational]
url    = https://github.com/spring-projects/spring-data-relational.git
ref    = 4.1.1
sparse = src/main/antora

[github/spring/spring-data-redis]
url    = https://github.com/spring-projects/spring-data-redis.git
ref    = 4.1.1
sparse = src/main/antora

[github/spring/spring-kafka]
url    = https://github.com/spring-projects/spring-kafka.git
sparse = spring-kafka-docs

# Two paths on purpose: the prose is src/docs/antora, and spring-modulith-docs
# is the Documenter module — Java, not documentation. It is the API you read
# when changing what Modulith generates, which is why it is worth the 15 files.
[github/spring/spring-modulith]
url    = https://github.com/spring-projects/spring-modulith.git
sparse = src/docs/antora spring-modulith-docs

# ---------------------------------------------------------------- Frontend

[github/tanstack/router]
url    = https://github.com/TanStack/router.git
sparse = docs

[github/tanstack/query]
url    = https://github.com/TanStack/query.git
sparse = docs

[github/tanstack/table]
url    = https://github.com/TanStack/table.git
sparse = docs

[github/tanstack/form]
url    = https://github.com/TanStack/form.git
sparse = docs

[github/tanstack/virtual]
url    = https://github.com/TanStack/virtual.git
sparse = docs

[github/tanstack/devtools]
url    = https://github.com/TanStack/devtools.git
sparse = docs

# 2.5 GB of monorepo for one directory, and pinned to the release branch rather
# than main, because the docs for a version you do not run are worse than none.
[github/vercel/next.js]
url    = https://github.com/vercel/next.js.git
ref    = next-16-3
sparse = docs
