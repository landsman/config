name: dependabot title

# Dependabot titles a group PR "bump the composer group in /app with 2 updates",
# and nothing in dependabot.yml can change that text — while a squash-merge makes
# it the commit subject. This keeps the `deps(<scope>)` prefix and names what was
# bumped. bin/dependabot/title.sh decides the text; `make bin-test` tests it.
#
# A caller runs it on `pull_request`, not `pull_request_target`: a Dependabot run
# gets a read-only token by default, but the caller's `permissions:` may raise it,
# and that avoids running with the base repo's secrets. A called workflow cannot
# hold more than its caller grants, so the caller's job says
# `permissions: { contents: read, pull-requests: write }`.
on:
  workflow_call:

jobs:
  retitle:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # This workflow's own repository, at the commit the caller resolved it to.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: bin/dependabot
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: rewrite the title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
          FROM: ${{ steps.meta.outputs.previous-version }}
          TO: ${{ steps.meta.outputs.new-version }}
        run: gh pr edit "$PR" --title "$(bin/dependabot/title.sh "$TITLE" "$NAMES" "$FROM" "$TO")"
