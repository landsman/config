name: claude-sandbox-version

# Dependabot cannot see the ARG CLAUDE_VERSION in bin/claude-sandbox/Dockerfile,
# so this looks weekly and opens one issue when a newer major is out.
# TODO: drop for a Renovate custom regex manager, see bin/claude-sandbox/check-version.sh.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Open or update the issue when a newer major is out
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/claude-sandbox/check-version.sh report
