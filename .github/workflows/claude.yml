name: claude

# The job itself, written once and called by every repo of mine that wants
# @claude to answer. Same reach as the semgrep workflow next door: a reusable
# workflow in a public repo can be called from anywhere, including a private
# repo in another org.
#
# What that buys is not fewer lines — the caller stub below is about the size
# of the standalone workflow it replaces. It is that the action version, the
# checkout, and anything this grows later (a model pin, a settings file, a
# network allowlist) move here once instead of once per repo. Dependabot
# watches this file; it does not watch a copy pasted into six others.
#
# A repo adopts it with .github/workflows/claude-mentions.yml:
#
#     name: claude mentions
#     on:
#       issue_comment:
#         types: [created]
#       pull_request_review_comment:
#         types: [created]
#     jobs:
#       claude:
#         if: >-
#           github.event.comment.user.login == 'landsman' &&
#           contains(github.event.comment.body, '@claude')
#         uses: landsman/config/.github/workflows/claude.yml@main
#         permissions:
#           contents: write
#           pull-requests: write
#           issues: write
#           id-token: write
#         secrets:
#           CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# The triggers and the permissions have to stay with the caller — `on:` because
# a called workflow has none of its own, and `permissions:` because the caller's
# grant is a ceiling this file can lower but never raise. Getting that wrong is
# a 403 when Claude tries to push, not a startup error, so the stub says both.
#
# Who may trigger it stays with the caller as well, and the stub's login check
# is not the thing keeping strangers out — the action refuses anyone without
# write access to the calling repo, and that is what makes a public repo safe
# to leave this on. The login check is narrower on purpose: write access is a
# repo permission, but the bill is a Claude subscription, so a collaborator
# added later should get to push without getting to spend. Swap the login when
# adopting this somewhere else, or drop the line to allow every writer.
#
# The secret stays with the caller too, and that is the part adopting this does
# not save: a personal account has no org-level secrets, so every repo needs its
# own CLAUDE_CODE_OAUTH_TOKEN. Passed explicitly rather than `secrets: inherit`
# — inherit is documented for callers in the same org or enterprise, and the
# whole point of publishing this is that a caller might be neither.
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >-
          Claude subscription OAuth token from `claude setup-token`, valid a
          year. Not an Anthropic API key — the action takes those on a separate
          input, and one passed here bills pay-as-you-go instead of the plan.
        required: true

jobs:
  claude:
    runs-on: ubuntu-latest
    # Lowered from whatever the caller granted, so a stub that hands over
    # write-all still only gives Claude these four.
    permissions:
      contents: write        # push the branch it works on
      pull-requests: write   # open the PR and comment on it
      issues: write          # reply on the issue it was called from
      # Not optional, and the failure it causes is a misleading one: with no
      # `github_token` passed, the action trades this workflow's OIDC token for
      # a Claude GitHub App installation token, so that its comments and pushes
      # come from claude[bot]. Without this the run accepts the OAuth token,
      # then dies twenty seconds later on three retries of "Unable to get
      # ACTIONS_ID_TOKEN_REQUEST_URL" — which reads as an auth problem when it
      # is a permissions one.
      id-token: write
    steps:
      # The *calling* repository, which is what makes one copy of this work for
      # all of them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # so it can branch from, and diff against, real history

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
