name: validate

on:
  pull_request:
    # Prose changes nothing any job here checks: qa parses shell and runs the
    # tests, security scans code. A PR touching only Markdown skips the run.
    paths-ignore: ['**.md']
  workflow_dispatch:   # so a run can be retried without closing and reopening the PR

# A new push supersedes the run still checking the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The BSD half of the same check is macos.yml, which a Linux-only change skips.
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Every tool mise.toml pins (bun, yq, gh), at the pinned version, on both
      # runners: the same versions as on the laptops, one place to bump them.
      - uses: jdx/mise-action@v5
      - run: make qa

  # Its own job, not a matrix step: semgrep reads the files, not the machine, so
  # a macOS run would spend a second runner to reach the same verdict — and
  # macOS runners have no Docker. Separate also means a red scan and a red test
  # are told apart in the checks list without opening either.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make security
