name: validate

on:
  pull_request:
  workflow_dispatch:   # so a run can be retried without closing and reopening the PR

jobs:
  # Both userlands, because that is where the bugs are. The scripts under bin/
  # run on the Mac and on the ThinkPads, and BSD and GNU disagree on enough to
  # matter: BSD grep reads `-Dawt.toolkit.name=` as an option, BSD sed reads
  # `\|` as a literal pipe. Linux alone would have passed all three.
  # macos-latest also gives bash 3.2, which is what Apple still ships.
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: make qa

  # Its own job, not a matrix step: semgrep reads the files, not the machine, so
  # the macOS leg would spend a second runner to reach the same verdict — and
  # macOS runners have no Docker. Separate also means a red scan and a red test
  # are told apart in the checks list without opening either.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make security
