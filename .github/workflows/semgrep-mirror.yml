name: semgrep mirror

# Runs when the mirror's Dockerfile changes on main — which in practice means a
# Dependabot bump was merged. Still deliberate: merging is the decision, and the
# path filter means no other push here can publish. It used to be dispatch-only
# with the version typed into a box, and that put the mirror one forgotten step
# behind every bump, which is the whole reason this trigger exists.
#
# workflow_dispatch stays for re-publishing a tag without touching the file, and
# because a workflow with no manual trigger cannot be tested without a merge.
on:
  push:
    branches: [main]
    paths: ['.github/semgrep-mirror.Dockerfile']
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    # packages: write to push; contents: read is the checkout's default, restated
    # because naming any scope at all drops the rest to none.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The repo's own CI token is enough here — it can write packages under the
      # same owner — which is what makes this a workflow rather than something
      # you run from a laptop with a personal access token.
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # Through the Makefile, so the pull/build/push is written once and a laptop
      # can still do it. Nothing is passed in: the Makefile reads the version out
      # of the Dockerfile, which also means there is no `${{ }}` expanded into a
      # run block — the script injection p/ci exists to catch.
      - name: Mirror the image
        run: make semgrep-mirror

      # First push of a new package creates it private, and a private package is
      # useless to the repos that pull it anonymously. GITHUB_TOKEN cannot change
      # visibility, so this is the one step that stays manual — said out loud in
      # the log rather than left in a comment nobody opens.
      # The tag itself is not repeated here: `docker push` above already printed
      # it, and a second copy is a second thing to keep true.
      - name: Say what is still manual
        run: |
          echo "if this is the first version ever pushed, set the package to public:"
          echo "  https://github.com/users/${{ github.repository_owner }}/packages/container/semgrep-mirror/settings"
          echo "until then other repos fall back to docker hub."
