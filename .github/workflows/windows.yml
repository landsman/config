name: windows

# Its own workflow so it can be filtered by path: little else in the repo
# reaches a Windows machine. apply.ps1 reads os/windows and links shared/, whose
# Claude Code settings run the hooks in bin/agents/ there; a Brewfile change has
# no way to break it. A job-level filter does not exist in Actions, which is why
# this is not a job in ci.yml.
on:
  pull_request:
    paths:
      - os/windows/**
      - shared/**
      - bin/agents/**
      - bin/lib/bun/**
      # Used only by the call recording in bin/calls, which is macOS-only. A hook
      # that starts importing one fails bin/agents/windows-paths.test.ts.
      - '!bin/lib/bun/cli*.ts'
      - '!bin/lib/bun/files*.ts'
      - '!bin/lib/bun/media*.ts'
      - '!bin/lib/bun/proc*.ts'
      - '!bin/lib/bun/term*.ts'
      - .gitattributes
      - .github/workflows/windows.yml
      # Rules and skills under shared/ are prose; editing one cannot break apply.ps1.
      - '!**.md'
  workflow_dispatch:

# A new push supersedes the run still checking the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Windows half runs for real rather than being parsed. x64, like the
  # T480; the only hosted Windows 11 image is Arm, where x64 installers run
  # emulated and prove little. Server ships without winget, so it is installed
  # first. What Server cannot check is the Power & battery mode, which is a
  # client setting; the T480 run covers that.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install winget
        run: |
          Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery
          Repair-WinGetPackageManager -AllUsers -Force
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File os\windows\apply.ps1
      - name: Skills are reachable where Claude Code looks
        run: if (-not (Test-Path "$HOME\.claude\skills\git-commit-messages\SKILL.md")) { throw 'not linked' }
      # As Claude Code runs them: Git Bash, through the shebang. The PATH is
      # reread because winget wrote bun's onto the machine, not into this job.
      - name: The hooks run under Git Bash
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          & "$env:ProgramFiles\Git\bin\bash.exe" -c 'for h in bin/agents/*.ts; do [[ $h == *.test.ts ]] && continue; echo "== $h"; echo "{}" | "$h" || exit 1; done'
