version: 2

updates:
  # Watches the FROM line in bin/semgrep/Dockerfile, which is the only place
  # this repo records which semgrep to mirror. `directory` is the folder the
  # Dockerfile sits in, not the file.
  #
  # Not under .github/: only the github-actions ecosystem may write there. At
  # .github/semgrep-mirror.Dockerfile the update was found and computed, then
  # GitHub refused the pull request — "The request contains invalid or
  # unauthorized changes" (dependabot/dependabot-core#15237) — so no bump ever
  # arrived, and the mirror sat at 1.172.0 while semgrep moved on. The name is
  # not the problem; a prefix.Dockerfile works anywhere else.
  #
  # Merging what it opens is the whole trigger: the mirror workflow watches that
  # same path on main and publishes the new tag by itself.
  - package-ecosystem: docker
    directory: /bin/semgrep
    schedule:
      interval: weekly
    # p/ci's dependabot-missing-cooldown asked for this, and it is worth more here
    # than in most repos: merging one of these pull requests publishes the mirror
    # by itself, so a semgrep release pulled the hour it appeared would be pushed
    # to the package every other repo of mine scans with. A week is long enough
    # for a bad release to be yanked before it is my problem.
    cooldown:
      default-days: 7

  # The workflows themselves. Actions are referenced by major tag here on purpose
  # (see AGENTS.md), and Dependabot respects that — it moves v7 to v8, it does not
  # rewrite a tag into a SHA, which is what the excluded p/ci rule wanted.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
