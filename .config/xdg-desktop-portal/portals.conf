# Pin the Secret Service portal backend to kwallet.
#
# Why: Chrome/Electron encrypt cookies with a key fetched via the Secret
# Service *portal*. The kwallet backend (kwallet.portal) only advertises itself
# with `UseIn=kde`, so it's selected only if XDG_CURRENT_DESKTOP=KDE is already
# set when xdg-desktop-portal resolves backends. After a boot/resume the portal
# can start before the session env propagates -> Secret backend unresolved ->
# Chrome's key provider gets nothing, generates a fresh key, and can no longer
# decrypt existing cookies -> logged out of every site. Pinning removes the
# timing dependency so kwallet always serves Secret.
#
# This fixes the root cause at the portal layer -> no Chrome launch flags, no
# vendor .desktop override, survives Chrome package updates.
[preferred]
org.freedesktop.impl.portal.Secret=kwallet
