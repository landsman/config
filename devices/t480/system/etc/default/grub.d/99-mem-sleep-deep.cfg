# Pin suspend to S3 ("deep") rather than s2idle.
#
# This pins a default, it does not change one: the T480's firmware does not
# advertise low-power S0 idle, so the kernel already picks deep here — 241 of
# the 243 suspends in this machine's journal, on boots whose cmdline did not
# carry this parameter. Written down because a default is not a promise.
#
# A drop-in, not an edit to /etc/default/grub: that file also carries the
# kernel pin and the LUKS UUID, so it stays the machine's, not the repo's.
GRUB_CMDLINE_LINUX_DEFAULT="mem_sleep_default=deep $GRUB_CMDLINE_LINUX_DEFAULT"
