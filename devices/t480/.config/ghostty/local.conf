# Stowed to ~/.config/ghostty/local.conf on the T480 only — devices/t480 is
# linked just on this host. The shared config pulls it in with
# `config-file = ?~/.config/ghostty/local.conf`; the `?` means every other
# machine, which has no such file, loads nothing. Default font-size is 12; the
# T480's 14" panel reads better a notch smaller.
font-size = 10
